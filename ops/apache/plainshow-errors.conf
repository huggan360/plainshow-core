# PlainShow's error and "updating" pages for every site on this server.
# Installed by core's ops/deploy.sh into /etc/apache2/conf-available and
# enabled with a2enconf. The pages come from the UI kit (ui/errors) and are
# copied to /srv/plainshow/errors on every core release.

Alias /_errors/ /srv/plainshow/errors/
<Directory /srv/plainshow/errors/>
    Require all granted
</Directory>

ErrorDocument 401 /_errors/401.html
ErrorDocument 403 /_errors/403.html
ErrorDocument 404 /_errors/404.html
ErrorDocument 429 /_errors/429.html
ErrorDocument 500 /_errors/500.html
ErrorDocument 503 /_errors/503.html

# While the update runner installs a site it creates
# /srv/plainshow/updating/<host>; visitors then get the "updating" page.
# Requests from this machine (the runner's health checks) pass through.
<If "-f '/srv/plainshow/updating/%{HTTP_HOST}' && %{REMOTE_ADDR} != '127.0.0.1' && %{REMOTE_ADDR} != '::1' && ! %{REQUEST_URI} =~ m#^/_errors/#">
    ErrorDocument 503 /_errors/updating.html
    Header always set Retry-After "30"
    Redirect 503
</If>
